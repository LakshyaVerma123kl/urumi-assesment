apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.woocommerceMcp.name }}
  labels:
    app: {{ .Values.woocommerceMcp.name }}
    app.kubernetes.io/name: woocommerce-mcp
    app.kubernetes.io/component: mcp-upstream
spec:
  replicas: {{ .Values.woocommerceMcp.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.woocommerceMcp.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.woocommerceMcp.name }}
    spec:
      containers:
        - name: woocommerce-mcp
          image: "{{ .Values.woocommerceMcp.image.repository }}:{{ .Values.woocommerceMcp.image.tag }}"
          imagePullPolicy: {{ .Values.woocommerceMcp.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.woocommerceMcp.service.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.woocommerceMcp.env.PORT | quote }}
            - name: WC_URL
              value: {{ .Values.woocommerceMcp.env.WC_URL | quote }}
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: WC_CONSUMER_KEY
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: WC_CONSUMER_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.woocommerceMcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.woocommerceMcp.name }}
  labels:
    app: {{ .Values.woocommerceMcp.name }}
spec:
  type: {{ .Values.woocommerceMcp.service.type }}
  ports:
    - port: {{ .Values.woocommerceMcp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.woocommerceMcp.name }}
