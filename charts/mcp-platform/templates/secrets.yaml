apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    app.kubernetes.io/name: mcp-platform
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  LLM_PROVIDER: {{ .Values.secrets.llmProvider | quote }}
  LLM_MODEL: {{ .Values.secrets.llmModel | quote }}
  WC_CONSUMER_KEY: {{ .Values.secrets.wcConsumerKey | quote }}
  WC_CONSUMER_SECRET: {{ .Values.secrets.wcConsumerSecret | quote }}
