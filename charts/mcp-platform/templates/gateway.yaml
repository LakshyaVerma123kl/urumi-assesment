apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    app: {{ .Values.gateway.name }}
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.gateway.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.gateway.name }}
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.gateway.service.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.gateway.env.PORT | quote }}
            - name: BASE_DOMAIN
              value: {{ .Values.domain | quote }}
            - name: WC_MCP_URL
              value: {{ .Values.gateway.env.WC_MCP_URL | quote }}
            - name: TIME_MCP_URL
              value: {{ .Values.gateway.env.TIME_MCP_URL | quote }}
            - name: CALC_MCP_URL
              value: {{ .Values.gateway.env.CALC_MCP_URL | quote }}
            - name: UPSTREAM_TIMEOUT
              value: {{ .Values.gateway.env.UPSTREAM_TIMEOUT | quote }}
            - name: HEALTH_CHECK_INTERVAL
              value: {{ .Values.gateway.env.HEALTH_CHECK_INTERVAL | quote }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: LLM_API_KEY
            - name: LLM_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: LLM_PROVIDER
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: LLM_MODEL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    app: {{ .Values.gateway.name }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.gateway.name }}
