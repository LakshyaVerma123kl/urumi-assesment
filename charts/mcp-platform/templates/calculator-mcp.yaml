apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.calculatorMcp.name }}
  labels:
    app: {{ .Values.calculatorMcp.name }}
    app.kubernetes.io/name: calculator-mcp
    app.kubernetes.io/component: mcp-upstream
spec:
  replicas: {{ .Values.calculatorMcp.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.calculatorMcp.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.calculatorMcp.name }}
    spec:
      containers:
        - name: calculator-mcp
          image: "{{ .Values.calculatorMcp.image.repository }}:{{ .Values.calculatorMcp.image.tag }}"
          imagePullPolicy: {{ .Values.calculatorMcp.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.calculatorMcp.service.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.calculatorMcp.env.PORT | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.calculatorMcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.calculatorMcp.name }}
  labels:
    app: {{ .Values.calculatorMcp.name }}
spec:
  type: {{ .Values.calculatorMcp.service.type }}
  ports:
    - port: {{ .Values.calculatorMcp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.calculatorMcp.name }}
