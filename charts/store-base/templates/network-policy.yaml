{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: store-network-policy
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: store
    store: "{{ .Values.store.id }}"
spec:
  podSelector: {}  
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  # Allow ingress controller to reach WordPress
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 80
  
  # Allow WordPress to reach MySQL
  - from:
    - podSelector:
        matchLabels:
          app: wordpress
    ports:
    - protocol: TCP
      port: 3306
  
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  
  # Allow WordPress to reach MySQL
  - to:
    - podSelector:
        matchLabels:
          app: mysql
    ports:
    - protocol: TCP
      port: 3306
  
  # Allow outbound HTTP/HTTPS for WordPress updates and plugins
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
  
  # Allow all egress within same namespace
  - to:
    - podSelector: {}
{{- end }}